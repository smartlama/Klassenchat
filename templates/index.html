<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Klassenchat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main>
        <h1>Klassenchat</h1>

        <form method="POST">
            <input
                type="text"
                name="username"
                placeholder="Name"
                value="{{ saved_username }}"
                required
            >

            <input
                type="text"
                name="text"
                placeholder="Nachricht"
                required
            >

            <button type="submit">Senden</button>
        </form>

        <section>
            {% if messages %}
                {% for msg in messages %}
                    <article>
                        <strong>{{ msg.username }}</strong>
                        <small>{{ msg.timestamp }}</small>
                        <p>{{ msg.text }}</p>
                    </article>
                {% endfor %}
            {% else %}
                <p>Noch keine Nachrichten vorhanden.</p>
            {% endif %}
        </section>
    </main>

</body>
</html>
